# ─────────────────────────────────────────
# 数据集配置
# ─────────────────────────────────────────
dataset: cifar10           # 选择数据集: cifar10 | cifar100
data_dir: ./data           # 数据集存放路径

# ─────────────────────────────────────────
# 预训练权重
# ─────────────────────────────────────────
pretrained: ../checkpoint-284.pth.tar

# ─────────────────────────────────────────
# 模型结构（必须与预训练模型一致）
# ─────────────────────────────────────────
img_size: 224              # 输入图像大小，CIFAR 32x32 会插值到此尺寸
embed_dims: 768            # embedding 维度
num_heads: 8               # attention head 数量
depths: 8                  # transformer block 层数
T: 4                       # SNN 时间步

# ─────────────────────────────────────────
# 冻结策略
# ─────────────────────────────────────────
freeze_ratio: 0.75          # 冻结参数比例
                           # 0.0 = 全部参数可训练
                           # 0.75 = 冻结前75%参数，只训练后25%（含head）
                           # 1.0 = 只训练head

# ─────────────────────────────────────────
# MeZO 超参数
# ─────────────────────────────────────────
random_mode: PGUST         # 随机数生成方式: Randn | Randint | PGUST | PGUPeZO
seed: '0x123456789'        # PGU 随机种子（仅 PGUST 模式使用）
lr: 5e-6                   # MeZO 学习率
epsilon: 1e-3              # MeZO 扰动幅度
weight_decay: 1e-4         # 权重衰减
perturb_nums: 5            # 每步扰动次数（>1 时使用多次扰动估计梯度）

# ─────────────────────────────────────────
# 训练配置
# ─────────────────────────────────────────
epochs: 500                 # 训练轮数
batch_size: 64             # 训练 batch size
val_batch_size: 64        # 验证 batch size
device: cuda:0             # 使用的设备
workers: 4                 # DataLoader 工作进程数
log_interval: 782          # 每隔多少 batch 打印一次训练信息
output_dir: ./output       # 模型和日志保存路径
